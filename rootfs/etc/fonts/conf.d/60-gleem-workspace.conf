<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Fonts a renter brings with their saved setup live on the workspace, so text
  sources in a restored scene find them by name as they did on the renter's
  own machine.
-->
<fontconfig>
  <dir>/workspace/media/fonts</dir>
</fontconfig>
