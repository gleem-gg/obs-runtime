name: Publish

# Builds the runtime image and pushes it to ghcr.io/gleem-gg/obs-runtime.
#
# Every push to main publishes `latest` plus an immutable `sha-<commit>` tag,
# and the job summary prints the manifest digest. The digest is the thing
# that matters: the control plane hands rentals the image pinned by
# HOSTING_RUNTIME_DIGEST, so after a build you copy the digest from the
# summary into the production env and restart the worker. A moved `latest`
# tag on its own changes nothing on any host.
#
# amd64 only. Hosts are x86 machines with an NVIDIA GPU; there is no arm64
# NVENC path to build for.
on:
  push:
    branches: [main]
    paths:
      - Containerfile
      - init/**
      - rootfs/**
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'gleem-gg/obs-runtime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/gleem-gg/obs-runtime
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Gleem OBS runtime
            org.opencontainers.image.description=Headless OBS desktop streamed to the renter's browser over WebRTC with NVENC
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record the digest
        run: |
          {
            echo "## Published"
            echo
            echo '```'
            echo "ghcr.io/gleem-gg/obs-runtime@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "Pin it in production with:"
            echo
            echo '```'
            echo "HOSTING_RUNTIME_DIGEST=${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
