<!doctype html>
<!--
  Source of rootfs/usr/share/gleem/wallpaper.png, the desktop behind OBS.
  Laid out in vh units, so any 16:9 size renders the same composition.
  To regenerate (fetches the Unbounded font from Google Fonts):

    google-chrome --headless=new --hide-scrollbars --virtual-time-budget=5000 \
      --window-size=2560,1440 --screenshot=wallpaper.png wallpaper.html

  Kept free of grain and noise on purpose: the desktop reaches the renter as
  H.264, and texture only makes every keyframe bigger.
-->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #131317; }
  .wall {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 55% 70% at 88% 12%, rgba(124, 58, 237, 0.30), transparent 70%),
      radial-gradient(ellipse 50% 60% at 8% 100%, rgba(167, 139, 250, 0.16), transparent 70%),
      radial-gradient(ellipse 80% 80% at 50% 50%, #17161d, #111114 100%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(196, 181, 253, 0.10) 1.2px, transparent 1.4px);
    background-size: 3vh 3vh;
    -webkit-mask-image: radial-gradient(ellipse 70% 80% at 80% 20%, #000 0%, transparent 75%);
            mask-image: radial-gradient(ellipse 70% 80% at 80% 20%, #000 0%, transparent 75%);
  }
  .spark {
    position: absolute; right: -9vh; top: -12vh; height: 88vh; opacity: 0.16;
  }
  .brand {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: flex; align-items: center; gap: 2.2vh;
    font-family: 'Unbounded', sans-serif; font-weight: 700; letter-spacing: -0.02em;
    font-size: 6.4vh; color: rgba(244, 243, 248, 0.10);
  }
  .brand svg { height: 7.6vh; }
</style>
</head>
<body>
<div class="wall"></div>
<div class="grid"></div>
<svg class="spark" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <path id="mark" fill="url(#g)" d="M423.5 117.2C419 118.9 416 123.2 416 128C416 132.8 419 137.1 423.5 138.8L480 160L501.2 216.5C502.9 221 507.2 224 512 224C516.8 224 521.1 221 522.8 216.5L544 160L600.5 138.8C605 137.1 608 132.8 608 128C608 123.2 605 118.9 600.5 117.2L544 96L522.8 39.5C521.1 35 516.8 32 512 32C507.2 32 502.9 35 501.2 39.5L480 96L423.5 117.2zM238.5 137.3C235.9 131.6 230.2 128 224 128C217.8 128 212.1 131.6 209.5 137.3L156.4 252.3L41.4 305.4C35.6 308.1 32 313.8 32 320C32 326.2 35.6 331.9 41.3 334.5L156.3 387.6L209.4 502.6C212 508.3 217.7 511.9 223.9 511.9C230.1 511.9 235.8 508.3 238.4 502.6L291.5 387.6L406.5 334.5C412.2 331.9 415.8 326.2 415.8 320C415.8 313.8 412.2 308.1 406.5 305.5L291.5 252.4L238.4 137.4zM448 480L391.5 501.2C387 502.9 384 507.2 384 512C384 516.8 387 521.1 391.5 522.8L448 544L469.2 600.5C470.9 605 475.2 608 480 608C484.8 608 489.1 605 490.8 600.5L512 544L568.5 522.8C573 521.1 576 516.8 576 512C576 507.2 573 502.9 568.5 501.2L512 480L490.8 423.5C489.1 419 484.8 416 480 416C475.2 416 470.9 419 469.2 423.5L448 480z"/>
</svg>
<div class="brand">
  <svg id="small" viewBox="0 0 640 640"></svg>
  <span>Gleem</span>
</div>
<script>const c=document.getElementById("mark").cloneNode();c.removeAttribute("id");c.setAttribute("fill","rgba(244,243,248,0.10)");document.getElementById("small").appendChild(c);</script>
</body>
</html>
